[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ToddlerBox"
version = "0.5.3"
description = "ToddlerBox launcher and apps"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pygame-ce>=2.5.2",
  "Pillow>=10.4.0",
  "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "cryptography==46.0.3",
    "pytest==9.1.1",
]

[tool.ruff]
target-version = "py312"
extend-exclude = ["build", "data"]

[tool.ruff.lint]
# Correctness only: syntax errors, invalid comparisons, misplaced statements, undefined names.
select = ["E9", "F63", "F7", "F82"]
