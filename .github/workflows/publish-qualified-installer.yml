name: Publish qualified installer
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.12.19'
      - name: Reassemble verified public installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --no-project --python /usr/bin/python3 scripts/download-public-installer.py docs/builds/8776dfa5476b7156-transfer.json toddlerbox-installer.iso
          printf '%s  %s\n' 'c8ea365bcacfe5d6957cea14152a68edd9ac168a4214e01022ccf72160a4a235' toddlerbox-installer.iso > SHA256SUMS
          uv run --no-project --python /usr/bin/python3 scripts/download-public-installer.py docs/builds/8776dfa5476b7156-update-transfer.json ToddlerBox-update.pyz
          printf '%s  %s\n' '1e8f4839cfac6bc732071068ed460a18fa2fedb344753e78ed7277d3cd829bf9' ToddlerBox-update.pyz >> SHA256SUMS
          sha256sum -c SHA256SUMS
          cp docs/releases/installer-8776dfa5476b7156.json source.json
          cp docs/releases/packages-8776dfa5476b7156.tsv packages.tsv
          cp releases/stable.json releases/stable.json.sig .
      - name: Publish normal release assets after checksum verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.3.0 toddlerbox-installer.iso ToddlerBox-update.pyz SHA256SUMS source.json packages.tsv stable.json stable.json.sig --clobber
