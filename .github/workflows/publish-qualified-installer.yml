name: Publish qualified installer
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.12.19'
      - name: Reassemble verified public installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --no-project --python /usr/bin/python3 scripts/download-public-installer.py docs/builds/1e136b40a252ca52-transfer.json toddlerbox-installer.iso
          printf '%s  %s\n' 'cf77521416b89ab187e31fc64dad36f73fc48d17081b1bd0f4705cde3bea7db8' toddlerbox-installer.iso > SHA256SUMS
          uv run --no-project --python /usr/bin/python3 scripts/download-public-installer.py docs/builds/1e136b40a252ca52-update-transfer.json ToddlerBox-update.pyz
          printf '%s  %s\n' 'f56c93babcf6b449a4c56850f0c43b3d9c1b7ce12bbae73ee71c45f12d913595' ToddlerBox-update.pyz >> SHA256SUMS
          sha256sum -c SHA256SUMS
          cp docs/releases/installer-1e136b40a252ca52.json source.json
          cp docs/releases/packages-1e136b40a252ca52.tsv packages.tsv
          cp releases/stable.json releases/stable.json.sig .
      - name: Publish normal release assets after checksum verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.3.0 toddlerbox-installer.iso ToddlerBox-update.pyz SHA256SUMS source.json packages.tsv stable.json stable.json.sig --clobber
