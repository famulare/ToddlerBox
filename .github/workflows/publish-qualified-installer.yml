name: Publish qualified installer
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.12.19'
      - name: Reassemble verified public installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --no-project --python /usr/bin/python3 scripts/download-public-installer.py docs/builds/5046c47496917dd3-transfer.json toddlerbox-installer.iso
          printf '%s  %s\n' '9b26aa5452f511fffe92f711a22c5b390eac064bd0a89b1e09782801469b4199' toddlerbox-installer.iso > SHA256SUMS
          uv run --no-project --python /usr/bin/python3 scripts/download-public-installer.py docs/builds/5046c47496917dd3-update-transfer.json ToddlerBox-update.pyz
          printf '%s  %s\n' '5e3f898d45b8788c1391a52113c1fcaa74d8de7dc404c30e1c91ecea198cc2c2' ToddlerBox-update.pyz >> SHA256SUMS
          sha256sum -c SHA256SUMS
          cp docs/releases/installer-5046c47496917dd3.json source.json
      - name: Publish normal release assets after checksum verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload toddlerbox-appliance-5046c47496917dd3 toddlerbox-installer.iso ToddlerBox-update.pyz SHA256SUMS source.json --clobber
