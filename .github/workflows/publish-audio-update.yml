name: Publish verified 0.5 update assets
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: toddlerbox-v0.5.0-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.12.19'
      - name: Reassemble and authenticate the qualified update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view v0.5.0 --json isDraft --jq .isDraft)" = true
          uv sync --frozen --group dev --python /usr/bin/python3
          uv run --frozen python scripts/download-public-installer.py docs/builds/4c260c85b3afe225-update-transfer.json ToddlerBox-update.pyz
          uv run --frozen python - <<'PY'
          import hashlib,json,sys,zipfile
          from pathlib import Path
          sys.path.insert(0,'system')
          from release_client import verify
          p=Path('docs/releases')
          v=verify((p/'v0.5.0-stable.json').read_bytes(),(p/'v0.5.0-stable.json.sig').read_bytes(),Path('system/release-public-key.pem').read_bytes())
          s=json.loads((p/'v0.5.0-source.json').read_text())
          assert v['tag']=='v0.5.0' and v['sequence']==3
          assert s['qualification_status']=='passed' and s['content']==v['source']
          b=Path('ToddlerBox-update.pyz')
          assert b.stat().st_size==v['bytes']
          with b.open('rb') as f: assert hashlib.file_digest(f,'sha256').hexdigest()==v['sha256']
          with zipfile.ZipFile(b) as z: assert json.loads(z.read('manifest.json'))['source']=={'git':s['git'],'content':s['content']}
          Path('SHA256SUMS').write_text(f"{v['sha256']}  ToddlerBox-update.pyz\n")
          PY
          # Copy public records only. No VM disks, raw serial logs or private keys.
          cp docs/releases/v0.5.0-source.json source.json
          cp docs/releases/v0.5.0-stable.json stable.json
          cp docs/releases/v0.5.0-stable.json.sig stable.json.sig
          if gh api repos/$GITHUB_REPOSITORY/git/ref/tags/v0.5.0 > tag.json 2> tag.err; then
            type=$(jq -r .object.type tag.json)
            sha=$(jq -r .object.sha tag.json)
            while test "$type" = tag; do
              gh api repos/$GITHUB_REPOSITORY/git/tags/$sha > tag.json
              type=$(jq -r .object.type tag.json)
              sha=$(jq -r .object.sha tag.json)
            done
            test "$type" = commit
            test "$sha" = "$(jq -r .git source.json)"
          else
            grep -q 'HTTP 404' tag.err
          fi
      - name: Upload to draft and check GitHub's byte identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.5.0 ToddlerBox-update.pyz SHA256SUMS source.json stable.json stable.json.sig --clobber
          gh api "repos/$GITHUB_REPOSITORY/releases/$(gh release view v0.5.0 --json databaseId --jq .databaseId)" > release.json
          uv run --frozen python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('release.json').read_text());s=json.loads(Path('source.json').read_text());v=json.loads(Path('stable.json').read_text())
          assert r['draft'] is True and r['target_commitish']==s['git']
          a=[a for a in r['assets'] if a['name']=='ToddlerBox-update.pyz'];assert len(a)==1
          assert a[0]['size']==v['bytes'] and a[0]['digest']=='sha256:'+v['sha256']
          PY
          # Maintainer publishes and advances stable metadata only after this succeeds.
